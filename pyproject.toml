[project]
name = "Owlangs"
description = "Collaborative translation platform with multi-user support and enterprise authentication"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "httpx==0.27.2",
    "fastapi[standard]>=0.115.12",
    "jsonpath-ng>=1.7.0",
    "openpyxl>=3.1.5",
    "xlsx2html>=0.6.2",
    "json-repair>=0.48.0",
    "mammoth>=1.10.0",
    "srt>=3.5.3",
    "lxml>=5.4.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.0",
    "beautifulsoup4>=4.13.4",
    "ebooklib>=0.18",
    "mobi>=0.3.0",
    "markdown>=3.8.2",
    "pymdown-extensions>=10.16.1",
    "chardet>=5.2.0",
    "redis>=6.4.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "ldap3>=2.9.1",
    "debugpy>=1.8.17",
    "playwright>=1.55.0",
    "pdf2docx>=0.5.8",
    "pypdf2>=3.0.0",
    "reportlab>=4.0.0",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "spacy==3.8.7",
    "spacy-pkuseg>=1.0.1",
    "langdetect>=1.0.9",
    "spacy-curated-transformers==0.3.1",
    "numpy==1.26.4",
    "pypandoc>=1.13",
    "concurrent-log-handler>=0.9.24",
    "html2text>=2024.2.26",
    "cryptography>=44.0.0",
    "pillow>=10.0.0,<12.0.0",
    "latex2mathml>=3.77.0",
    "mathml2omml>=0.0.2",
    "mathml2omml-as>=0.1.0",
]

# MOBI/EPUB export: Requires the Calibre *application* (ebook-convert), NOT the PyPI package "calibre".
# Install from https://calibre-ebook.com/download or: choco install calibre | brew install calibre | apt install calibre
# See docs/core/3RD_PARTY_DEPENDENCIES.md

[project.optional-dependencies]
pdf_export = [
    "playwright>=1.46.0",
]
docx_equation = []
docling = [
    # Use an OpenCV version compatible with numpy 1.26.x (avoid >=4.12 which requires numpy>=2)
    "opencv-python>=4.8,<4.12",
    "docling>=2.40.0",
]

[dependency-groups]
dev = [
    # Match docling optional constraint for local dev
    "opencv-python>=4.8,<4.12",
    "docling>=2.40.0",
]
[project.scripts]
backend = "backend.cli:main"

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
#packages = ["backend"]
[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
[tool.setuptools.package-data]
backend = ["static/**", "template/**"]

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

