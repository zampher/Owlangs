<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="loginPageTitle">Login - Owlangs</title>
    <link href="/static/bootstrap.css" rel="stylesheet">
    <link href="/static/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #0d6efd;
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .btn-primary {
            background: #6c757d;
            border: 1px solid #6c757d;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background: #5a6268;
            border-color: #5a6268;
            transform: translateY(-1px);
        }
        .alert {
            border-radius: 10px;
        }
        .forgot-password {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .forgot-password:hover {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card login-card">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <img src="/static/favicon.ico" alt="Owlangs Logo" style="width: 48px; height: 48px; margin-bottom: 16px;">
                            <h2 class="text-white mb-2">
                                Owlangs
                            </h2>
                            <p class="text-white-50"><span data-i18n="loginSubTitle">Document Translation System</span></p>
                            <!-- Login Banner -->
                            <div id="loginBanner" class="text-white-50 mt-3" style="font-size: 0.9rem; line-height: 1.4;">
                                {{ login_banner or 'Welcome to document translation system.' }}
                            </div>
                        </div>

                        <!-- Error Alert -->
                        <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span id="errorMessage"></span>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm" method="POST" action="/login">
                            <input type="hidden" name="next_url" value="{{ next_url or '' }}">
                            
                            <div class="mb-3">
                                <label for="username" class="form-label text-white">
                                    <i class="bi bi-person-fill me-2"></i><span data-i18n="loginUsernameLabel">Username</span>
                                </label>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       name="username" 
                                       data-i18n-placeholder="loginUsernamePlaceholder"
                                       placeholder="Please enter username"
                                       required
                                       autocomplete="username">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label text-white">
                                    <i class="bi bi-lock-fill me-2"></i><span data-i18n="loginPasswordLabel">Password</span>
                                </label>
                                <div class="input-group">
                                    <input type="password" 
                                           class="form-control" 
                                           id="password" 
                                           name="password" 
                                           data-i18n-placeholder="loginPasswordPlaceholder"
                                           placeholder="Please enter password"
                                           required
                                           autocomplete="current-password">
                                    <button class="btn btn-outline-light" type="button" id="toggleLoginPassword">
                                        <i class="bi bi-eye-slash"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-2"></i><span data-i18n="loginBtn">Login</span>
                                </button>
                            </div>

                            <div class="text-center">
                                <a href="mailto:admin@example.com?subject=Forgot%20Password" class="forgot-password">
                                    <i class="bi bi-question-circle me-1"></i><span data-i18n="loginForgotPassword">Forgot Password?</span>
                                </a>
                            </div>
                        </form>

                        <script>
                        (function(){
                          try{
                            var btn = document.getElementById('toggleLoginPassword');
                            var input = document.getElementById('password');
                            if(btn && input){
                              btn.addEventListener('click', function(){
                                var icon = this.querySelector('i');
                                if(input.type === 'password'){
                                  input.type = 'text';
                                  if(icon){ icon.className = 'bi bi-eye'; }
                                }else{
                                  input.type = 'password';
                                  if(icon){ icon.className = 'bi bi-eye-slash'; }
                                }
                              });
                            }
                          }catch(_){/* no-op */}
                        })();
                        </script>

                        <!-- LDAP Status Hint -->
                        {% if ldap_enabled %}
                        <div class="mt-3 text-center">
                            <small class="text-white-50">
                                <i class="bi bi-shield-check me-1"></i>
                                <span data-i18n="loginLdapEnabled">Using LDAP/AD Authentication</span>
                            </small>
                        </div>
                        {% else %}
                        <div class="mt-3 text-center">
                            <small class="text-white-50">
                                <i class="bi bi-info-circle me-1"></i>
                                <span data-i18n="loginDefaultAuth">Using Default Authentication</span>
                            </small>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/bootstrap.bundle.min.js"></script>
    <script src="/static/js/cache-buster.js"></script>
    <script>
        // i18n init for login page
        (async function initLoginI18n() {
            try {
                // 1) Read language priority: localStorage → backend default language → browser → en
                let lang = localStorage.getItem('ui_language');
                if (!lang) {
                    try {
                        const resp = await fetch('/auth/app-config', { credentials: 'include' });
                        if (resp.ok) {
                            const data = await resp.json();
                            lang = data.default_language || null;
                        }
                    } catch (e) { /* ignore */ }
                }
                if (!lang) {
                    const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
                    lang = browserLang.startsWith('zh') ? 'zh' : 'en';
                }

                // 2) Load i18nLogin.json (login-specific)
                const res = await CacheBuster.fetch('/i18n/i18nLogin.json');
                const all = await res.json();
                const dict = all[lang] || all['en'];

                // 3) Apply data-i18n text
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[key]) el.innerHTML = dict[key];
                });
                // 4) Apply data-i18n-placeholder
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    if (dict[key]) el.setAttribute('placeholder', dict[key]);
                });
                // 5) Apply data-i18n-title (including <title>)
                const titleKey = document.querySelector('title')?.getAttribute('data-i18n-title');
                if (titleKey && dict[titleKey]) document.title = dict[titleKey];

            } catch (e) {
                // Ignore login page i18n failure
            }
        })();

        // Show error message
        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorAlert.classList.remove('d-none');
        }

        // Hide error message
        function hideError() {
            document.getElementById('errorAlert').classList.add('d-none');
        }

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideError();

            const formData = new FormData(this);
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    // Login successful, redirect
                    console.log('✅ Login successful!');
                    console.log('📋 Response data:', result);
                    console.log('🔗 Redirect URL:', result.next_url || '/');
                    console.log('🌐 Current location:', window.location.href);
                    console.log('📝 About to redirect to:', result.next_url || '/');
                    
                    const redirectUrl = result.next_url || '/';
                    console.log('⏳ Redirecting to:', redirectUrl);
                    
                    // Add a small delay to ensure logs are visible
                    setTimeout(() => {
                        console.log('🚀 Executing redirect now...');
                        window.location.href = redirectUrl;
                    }, 100);
                } else {
                    // Login failed, show error
                try {
                    const res = await CacheBuster.fetch('/i18n/i18nLogin.json');
                        const dictAll = await res.json();
                        const lang = localStorage.getItem('ui_language') || 'en';
                        const dict = dictAll[lang] || dictAll['en'];
                        showError(result.message || dict['loginFailed'] || 'Login failed');
                    } catch (_) {
                        showError(result.message || 'Login failed');
                    }
                }
            } catch (error) {
                try {
                    const res = await CacheBuster.fetch('/i18n/i18nLogin.json');
                    const dictAll = await res.json();
                    const lang = localStorage.getItem('ui_language') || 'en';
                    const dict = dictAll[lang] || dictAll['en'];
                    if (error.status === 429) {
                        showError(dict['loginTooManyAttempts'] || 'Too many attempts');
                    } else if (error.status === 401) {
                        showError(dict['loginWrongCredentials'] || 'Incorrect username or password');
                    } else {
                        showError(dict['loginErrorOccurred'] || 'An error occurred during login');
                    }
                } catch (_) {
                    if (error.status === 429) {
                        showError('Too many login attempts, please try again later');
                    } else if (error.status === 401) {
                        showError('Incorrect username or password');
                    } else {
                        showError('An error occurred during login, please try again later');
                    }
                }
            }
        });

        // Check for error information in URL parameters when page loads
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            showError(decodeURIComponent(error));
        }
    </script>
</body>
</html>
